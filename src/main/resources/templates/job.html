<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: Dynamic per-job title + description -->
  <title th:text="${job.title} + ' at ' + ${job.company} + ' — Optify'">Job Title at Company — Optify</title>
  <meta name="description"
        th:content="'Apply for ' + ${job.title} + ' at ' + ${job.company} + '. ' +
                    (${job.location != null and not #strings.isEmpty(job.location)} ? ${job.location} + ' · ' : '') +
                    'Found on Optify — aggregated directly from the company career page.'">
  <meta name="robots" content="index, follow">
  <link rel="canonical" th:href="${siteUrl} + '/jobs/' + ${job.id}">

  <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Optify">
  <meta property="og:title"       th:content="${job.title} + ' at ' + ${job.company}">
  <meta property="og:description"
        th:content="(${job.location != null and not #strings.isEmpty(job.location)} ? '📍 ' + ${job.location} + '  ' : '') +
                    '🔗 Apply directly on ' + ${job.company} + '\'s career page via Optify.'">
  <meta property="og:url"         th:content="${siteUrl} + '/jobs/' + ${job.id}">
  <meta property="og:image"       th:content="${siteUrl} + '/images/og-default.svg'">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       th:content="${job.title} + ' at ' + ${job.company}">
  <meta name="twitter:description"
        th:content="(${job.location != null and not #strings.isEmpty(job.location)} ? ${job.location} + ' · ' : '') +
                    'Apply on Optify — aggregated from company career page.'">
  <meta name="twitter:image"       th:content="${siteUrl} + '/images/og-default.svg'">

  <!-- Schema.org JobPosting structured data -->
  <script type="application/ld+json" th:inline="javascript">
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": /*[[${job.title}]]*/ "Job Title",
    "hiringOrganization": {
      "@type": "Organization",
      "name": /*[[${job.company}]]*/ "Company"
    },
    "jobLocation": {
      "@type": "Place",
      "address": /*[[${job.location}]]*/ "Location"
    },
    "datePosted": /*[[${job.firstSeenAt}]]*/ "",
    "url": /*[[${siteUrl + '/jobs/' + job.id}]]*/ "",
    "applyUrl": /*[[${job.applyUrl}]]*/ "",
    "employmentType": "FULL_TIME",
    "description": /*[[${'Job listing for ' + job.title + ' at ' + job.company + ' via Optify.'}]]*/ ""
  }
  </script>

  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- NAV -->
<div th:replace="~{fragments/nav :: nav('jobs')}"></div>

<!-- PAGE HEADER (mini) -->
<div class="page-header" style="padding:1.25rem 0 1rem;">
  <div class="container">
    <p class="page-header-sub">
      <a href="/jobs" style="color:rgba(255,255,255,.5);text-decoration:none;">Browse Jobs</a>
      <span style="color:rgba(255,255,255,.25);margin:0 0.4rem;">/</span>
      <span th:text="${job.title}" style="color:rgba(255,255,255,.7);">Job Title</span>
    </p>
  </div>
</div>

<!-- DETAIL LAYOUT -->
<div class="detail-layout">
  <div class="container">

    <!-- Back link -->
    <a href="/jobs" class="back-link">← Back to Jobs</a>

    <div class="detail-card">

      <!-- Dark top section -->
      <div class="detail-card-top">
        <div class="detail-logo"
             th:text="${#strings.length(job.company) > 0} ? ${#strings.substring(job.company,0,2).toUpperCase()} : '?'">
          CO
        </div>
        <div class="detail-header-info">
          <h1 class="detail-title" th:text="${job.title}">Software Engineer</h1>
          <div class="detail-company" th:text="${job.company}">Acme Corp</div>
          <div class="detail-meta-row">
            <div class="detail-meta-item" th:if="${job.location != null and not #strings.isEmpty(job.location)}">
              <span class="detail-meta-icon">📍</span>
              <span th:text="${job.location}">Location</span>
            </div>
            <div class="detail-meta-item">
              <span class="detail-meta-icon">🕐</span>
              <span th:text="'First seen ' + ${#temporals.format(job.firstSeenAt, 'MMM d, yyyy')}">Date</span>
            </div>
            <div class="detail-meta-item">
              <span class="detail-meta-icon">🔗</span>
              <span th:text="${job.source}">Source</span>
            </div>
            <span th:if="${job.new}" class="detail-badge-new">✦ NEW</span>
          </div>
        </div>
      </div>

      <!-- Body -->
      <div class="detail-body">

        <!-- Info grid -->
        <div class="detail-info-grid">
          <div class="detail-info-item">
            <label>Job Title</label>
            <p th:text="${job.title}">Software Engineer</p>
          </div>
          <div class="detail-info-item">
            <label>Company</label>
            <p th:text="${job.company}">Acme Corp</p>
          </div>
          <div class="detail-info-item" th:if="${job.location != null and not #strings.isEmpty(job.location)}">
            <label>Location</label>
            <p th:text="${job.location}">Remote / Bangalore</p>
          </div>
          <div class="detail-info-item">
            <label>Source</label>
            <p th:text="${job.source}">Company Career Page</p>
          </div>
          <div class="detail-info-item" th:if="${job.postedDate != null and not #strings.isEmpty(job.postedDate)}">
            <label>Posted Date</label>
            <p th:text="${job.postedDate}">Jan 2025</p>
          </div>
          <div class="detail-info-item">
            <label>Status</label>
            <p th:text="${job.status}">ACTIVE</p>
          </div>
        </div>

        <!-- Actions -->
        <div class="detail-actions">
          <a th:href="${job.applyUrl}"
             target="_blank" rel="noopener noreferrer"
             class="btn btn-teal btn-lg">
            Apply Now →
          </a>
          <a href="/jobs" class="btn btn-outline">← All Jobs</a>
        </div>

        <!-- Share section -->
        <div class="share-section">
          <div class="share-label">Share this job</div>
          <div class="share-grid">

            <!-- WhatsApp -->
            <a class="share-btn share-btn-wa"
               th:href="'https://wa.me/?text=' + ${T(java.net.URLEncoder).encode(job.title + ' at ' + job.company + ' — Apply on Optify: ' + siteUrl + '/jobs/' + job.id, 'UTF-8')}"
               target="_blank" rel="noopener noreferrer" aria-label="Share on WhatsApp">
              <svg viewBox="0 0 24 24" fill="currentColor" class="share-icon">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg>
              WhatsApp
            </a>

            <!-- LinkedIn -->
            <a class="share-btn share-btn-li"
               th:href="'https://www.linkedin.com/sharing/share-offsite/?url=' + ${T(java.net.URLEncoder).encode(siteUrl + '/jobs/' + job.id, 'UTF-8')}"
               target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
              <svg viewBox="0 0 24 24" fill="currentColor" class="share-icon">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
              LinkedIn
            </a>

            <!-- Twitter / X -->
            <a class="share-btn share-btn-tw"
               th:href="'https://twitter.com/intent/tweet?text=' + ${T(java.net.URLEncoder).encode(job.title + ' at ' + job.company + ' — apply on Optify:', 'UTF-8')} + '&url=' + ${T(java.net.URLEncoder).encode(siteUrl + '/jobs/' + job.id, 'UTF-8')}"
               target="_blank" rel="noopener noreferrer" aria-label="Share on Twitter/X">
              <svg viewBox="0 0 24 24" fill="currentColor" class="share-icon">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
              Share
            </a>

            <!-- Copy link -->
            <button class="share-btn share-btn-copy"
                    th:onclick="'copyToClipboard(\'' + ${siteUrl} + '/jobs/' + ${job.id} + '\')'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="share-icon">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              Copy Link
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/main.js"></script>
</body>
</html>
