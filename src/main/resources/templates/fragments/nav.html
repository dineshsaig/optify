<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<nav th:fragment="nav(active)" class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Opti<span class="logo-dot">fy</span></a>
    <div class="nav-links">
      <a href="/jobs" th:classappend="${active == 'jobs'} ? ' is-active'" class="nav-link">Browse Jobs</a>
      <a href="/jobs?filter=new" th:classappend="${active == 'new'} ? ' is-active'" class="nav-link">
        New Today
        <span th:if="${newCount != null and newCount > 0}"
              th:text="'(' + ${newCount} + ')'"
              style="color:var(--c-teal);font-size:0.78rem;margin-left:0.2rem;"></span>
      </a>
    </div>
  </div>
</nav>
</body>
</html>
